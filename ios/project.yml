# XcodeGen project definition. The .xcodeproj is generated, not committed:
#   brew install xcodegen && cd ios && xcodegen generate
name: Rocimail
options:
  bundleIdPrefix: app.rocimail
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
packages:
  RociKit:
    path: RociKit
targets:
  Rocimail:
    type: application
    platform: iOS
    sources:
      - App/Sources
    dependencies:
      - package: RociKit
        product: RociModel
      - package: RociKit
        product: RociMail
      - package: RociKit
        product: RociStore
      - package: RociKit
        product: RociSync
      - package: RociKit
        product: RociSearch
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Rocimail
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Dev convenience: allow plain-http JMAP servers on the local network
        # (e.g. the docker-compose Stalwart at http://localhost:8080).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
